name: Feature request
description: 建議具體且公開安全的改善 / Suggest a bounded, public-safe improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用情境 / Use case
      description: 說明使用者問題，不要加入私人商業計劃、客戶資料或部署細節。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 建議結果 / Proposed outcome
      description: 說明最小而有用的公開結果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受替代方案 / Acceptable alternatives
  - type: checkboxes
    id: boundaries
    attributes:
      label: 邊界確認 / Boundary confirmation
      options:
        - label: This request contains no personal data, confidential business information, deployment identifiers, actual resource names, or production records.
          required: true
